name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fides
          POSTGRES_PASSWORD: fides
          POSTGRES_DB: fides
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package hygiene
        run: pnpm package:hygiene

      - name: Build
        run: pnpm build

      - name: Check public package packs
        run: pnpm package:packcheck

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://fides:fides@localhost:5432/fides

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery
          - trust-graph
          - policy-engine
          - registry
          - relay
          - agentd
          - platform-api

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    env:
      POSTGRES_PASSWORD: fides
      SERVICE_API_KEY: fides-smoke-key

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build smoke script dependencies
        run: |
          pnpm --filter @fides/shared build
          pnpm --filter @fides/core build

      - name: Build compose images
        run: docker compose build

      - name: Start compose services
        run: docker compose up -d postgres discovery trust-graph policy-engine registry relay agentd platform-api

      - name: Run docker smoke
        run: pnpm smoke:docker

      - name: Compose diagnostics
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Stop compose services
        if: always()
        run: docker compose down -v --remove-orphans
