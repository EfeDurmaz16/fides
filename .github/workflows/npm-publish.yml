name: npm Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package hygiene
        run: pnpm package:hygiene

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish public packages
        run: |
          set -euo pipefail
          for package_dir in \
            packages/shared \
            packages/core \
            packages/policy \
            packages/runtime \
            packages/discovery \
            packages/evidence \
            packages/sdk \
            packages/cli
          do
            echo "Publishing ${package_dir}"
            (cd "${package_dir}" && pnpm publish --access public --no-git-checks)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
