services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fides}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fides}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fides}"]
      interval: 5s
      timeout: 5s
      retries: 5

  discovery:
    build:
      context: .
      dockerfile: services/discovery/Dockerfile
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fides}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-fides}
      DISCOVERY_PORT: "3100"
      DISCOVERY_DB_AUTO_MIGRATE: ${DISCOVERY_DB_AUTO_MIGRATE:-true}
      DISCOVERY_DB_SCHEMA: ${DISCOVERY_DB_SCHEMA:-discovery}
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      DISCOVERY_API_KEYS: ${DISCOVERY_API_KEYS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy

  trust-graph:
    build:
      context: .
      dockerfile: services/trust-graph/Dockerfile
    ports:
      - "3200:3200"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fides}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-fides}
      TRUST_GRAPH_PORT: "3200"
      TRUST_GRAPH_DB_AUTO_MIGRATE: ${TRUST_GRAPH_DB_AUTO_MIGRATE:-true}
      TRUST_GRAPH_DB_SCHEMA: ${TRUST_GRAPH_DB_SCHEMA:-trust_graph}
      DISCOVERY_URL: http://discovery:3100
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      TRUST_GRAPH_API_KEYS: ${TRUST_GRAPH_API_KEYS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_started

  registry:
    build:
      context: .
      dockerfile: services/registry/Dockerfile
    ports:
      - "7346:7346"
    environment:
      REGISTRY_PORT: "7346"
      REGISTRY_STORE: ${REGISTRY_STORE:-postgres}
      REGISTRY_DATABASE_URL: ${REGISTRY_DATABASE_URL:-postgresql://${POSTGRES_USER:-fides}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-fides}}
      REGISTRY_DB_AUTO_MIGRATE: ${REGISTRY_DB_AUTO_MIGRATE:-true}
      REGISTRY_DB_POOL_MAX: ${REGISTRY_DB_POOL_MAX:-10}
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      REGISTRY_API_KEYS: ${REGISTRY_API_KEYS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy

  relay:
    build:
      context: .
      dockerfile: services/relay/Dockerfile
    ports:
      - "7347:7347"
    environment:
      RELAY_PORT: "7347"
      RELAY_STORE: ${RELAY_STORE:-file}
      RELAY_STORE_PATH: ${RELAY_STORE_PATH:-/data/fides/relay/relay-store.json}
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      RELAY_API_KEYS: ${RELAY_API_KEYS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - relay_data:/data/fides/relay

  policy-engine:
    build:
      context: .
      dockerfile: services/policy-engine/Dockerfile
    ports:
      - "3300:3300"
    environment:
      POLICY_ENGINE_PORT: "3300"
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      POLICY_ENGINE_API_KEYS: ${POLICY_ENGINE_API_KEYS:-}

  agentd:
    build:
      context: .
      dockerfile: services/agentd/Dockerfile
    ports:
      - "7345:7345"
    environment:
      AGENTD_PORT: "7345"
      AGENTD_AUTHORITY_STORE: ${AGENTD_AUTHORITY_STORE:-postgres}
      AGENTD_DATABASE_URL: ${AGENTD_DATABASE_URL:-postgresql://${POSTGRES_USER:-fides}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-fides}}
      AGENTD_DB_AUTO_MIGRATE: ${AGENTD_DB_AUTO_MIGRATE:-true}
      AGENTD_DB_POOL_MAX: ${AGENTD_DB_POOL_MAX:-10}
      DISCOVERY_URL: http://discovery:3100
      TRUST_GRAPH_URL: http://trust-graph:3200
      REGISTRY_URL: http://registry:7346
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      AGENTD_API_KEYS: ${AGENTD_API_KEYS:-}
      AGENTD_REQUIRE_AUTHORITY_SIGNATURE_VERIFICATION: ${AGENTD_REQUIRE_AUTHORITY_SIGNATURE_VERIFICATION:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_started
      trust-graph:
        condition: service_started
      registry:
        condition: service_started

  platform-api:
    build:
      context: .
      dockerfile: services/platform-api/Dockerfile
    ports:
      - "3600:3600"
    environment:
      PLATFORM_API_PORT: "3600"
      DISCOVERY_URL: http://discovery:3100
      TRUST_GRAPH_URL: http://trust-graph:3200
      POLICY_ENGINE_URL: http://policy-engine:3300
      REGISTRY_URL: http://registry:7346
      RELAY_URL: http://relay:7347
      AGENTD_URL: http://agentd:7345
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      PLATFORM_API_KEYS: ${PLATFORM_API_KEYS:-}
    depends_on:
      discovery:
        condition: service_started
      trust-graph:
        condition: service_started
      policy-engine:
        condition: service_started
      registry:
        condition: service_started
      relay:
        condition: service_started
      agentd:
        condition: service_started

volumes:
  postgres_data:
  relay_data:
