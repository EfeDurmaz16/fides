openapi: "3.0.3"
info:
  title: FIDES Agent Daemon (agentd)
  version: "2.0.0"
  description: |
    Local daemon providing a unified HTTP API that proxies to the FIDES
    trust fabric services (discovery, trust-graph, registry). Includes
    local services for evidence logging, policy evaluation, runtime
    attestation, and emergency kill switch.
  contact:
    name: FIDES Protocol
    url: https://github.com/EfeDurmaz16/fides

servers:
  - url: http://localhost:7345
    description: Local development
  - url: https://agentd.fides.example.com
    description: Production

tags:
  - name: Health
  - name: Identity
  - name: Card
  - name: Discovery
  - name: Trust
  - name: Policy
  - name: Evidence
  - name: Authority
  - name: Attestation
  - name: Kill Switch

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Service health check
      description: Probes all upstream services (discovery, trust-graph, registry).
      responses:
        "200":
          description: All upstream services reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more upstream services unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /identities:
    post:
      operationId: createLocalIdentity
      tags: [Identity]
      summary: Create a local FIDES identity
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonObject"
    get:
      operationId: listLocalIdentities
      tags: [Identity]
      summary: List local FIDES identities
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /identities/{id}:
    get:
      operationId: getLocalIdentity
      tags: [Identity]
      summary: Read a local FIDES identity
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
        "404":
          $ref: "#/components/responses/Error"

  /attestations:
    post:
      operationId: createLocalAttestation
      tags: [Attestation]
      summary: Issue a local identity or runtime attestation
      description: |
        Bodies with `identity` add local mock identity trust anchors for
        GitHub, email, domain, package registry, or wallet claims. Bodies with
        `agentId`, `codeHash`, `runtimeHash`, and `policyHash` issue a local
        MockTEE runtime attestation. Attestation issuance records evidence and
        does not grant authority by itself.
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonObject"

  /attestations/{id}:
    get:
      operationId: getRuntimeAttestation
      tags: [Attestation]
      summary: Read a local runtime attestation
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
        "404":
          $ref: "#/components/responses/Error"

  /attestations/{id}/verify:
    post:
      operationId: verifyRuntimeAttestation
      tags: [Attestation]
      summary: Verify a local runtime attestation
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /agent-cards:
    post:
      operationId: createLocalAgentCard
      tags: [Card]
      summary: Create a local AgentCard
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonObject"

  /agent-cards/{id}:
    get:
      operationId: getLocalAgentCard
      tags: [Card]
      summary: Read a local AgentCard
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
        "404":
          $ref: "#/components/responses/Error"

  /agent-cards/{id}/sign:
    post:
      operationId: signLocalAgentCard
      tags: [Card]
      summary: Sign a local AgentCard
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /agent-cards/{id}/verify:
    post:
      operationId: verifyLocalAgentCard
      tags: [Card]
      summary: Verify a local signed AgentCard
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /agents/register:
    post:
      operationId: registerLocalAgent
      tags: [Discovery]
      summary: Register a local AgentCard for discovery
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          description: Local agent registered as a discovery candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalAgentRegistration"

  /agents:
    get:
      operationId: listLocalAgents
      tags: [Discovery]
      summary: List locally registered agents
      responses:
        "200":
          description: Locally registered discovery candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalAgentListResponse"

  /agents/{id}:
    get:
      operationId: getLocalAgent
      tags: [Discovery]
      summary: Inspect a locally registered agent
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Local registration detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalAgentDetailResponse"
        "404":
          $ref: "#/components/responses/Error"

  /discover:
    post:
      operationId: discoverAgents
      tags: [Discovery]
      summary: Discover agent candidates across enabled providers
      requestBody:
        $ref: "#/components/requestBodies/DiscoveryQuery"
      responses:
        "200":
          $ref: "#/components/responses/Discovery"

  /discover/local:
    post:
      operationId: discoverLocalAgents
      tags: [Discovery]
      summary: Discover local agent candidates
      requestBody:
        $ref: "#/components/requestBodies/DiscoveryQuery"
      responses:
        "200":
          $ref: "#/components/responses/Discovery"

  /discover/well-known:
    post:
      operationId: discoverWellKnownAgents
      tags: [Discovery]
      summary: Discover well-known agent candidates
      requestBody:
        $ref: "#/components/requestBodies/DiscoveryQuery"
      responses:
        "200":
          $ref: "#/components/responses/Discovery"

  /discover/registry:
    post:
      operationId: discoverRegistryAgents
      tags: [Discovery]
      summary: Discover registry agent candidates
      requestBody:
        $ref: "#/components/requestBodies/DiscoveryQuery"
      responses:
        "200":
          $ref: "#/components/responses/Discovery"

  /discover/relay:
    post:
      operationId: discoverRelayAgents
      tags: [Discovery]
      summary: Discover relay agent candidates
      requestBody:
        $ref: "#/components/requestBodies/DiscoveryQuery"
      responses:
        "200":
          $ref: "#/components/responses/Discovery"

  /discover/dht:
    post:
      operationId: discoverDhtAgents
      tags: [Discovery]
      summary: Discover DHT pointer candidates
      requestBody:
        $ref: "#/components/requestBodies/DiscoveryQuery"
      responses:
        "200":
          $ref: "#/components/responses/Discovery"

  /trust/evaluate:
    post:
      operationId: evaluateLocalTrust
      tags: [Trust]
      summary: Evaluate capability-scoped local trust
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /trust/{id}:
    get:
      operationId: getLocalTrust
      tags: [Trust]
      summary: Read local trust results for an agent
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /reputation/update:
    post:
      operationId: updateLocalReputation
      tags: [Trust]
      summary: Update capability-specific local reputation
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /reputation/{id}:
    get:
      operationId: getLocalReputation
      tags: [Trust]
      summary: Read local reputation for an agent
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /policy/evaluate:
    post:
      operationId: evaluateLocalPolicy
      tags: [Policy]
      summary: Evaluate policy before execution
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          description: FIDES v2 policy decision. This never grants invocation authority by itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPolicyEvaluationResponse"

  /approvals:
    post:
      operationId: createLocalApprovalRequest
      tags: [Policy]
      summary: Create an approval request
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonObject"
    get:
      operationId: listLocalApprovals
      tags: [Policy]
      summary: List local approval requests
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /approvals/{id}/approve:
    post:
      operationId: approveLocalApprovalRequest
      tags: [Policy]
      summary: Approve a pending approval request
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /approvals/{id}/deny:
    post:
      operationId: denyLocalApprovalRequest
      tags: [Policy]
      summary: Deny a pending approval request
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /delegations:
    post:
      operationId: createLocalDelegation
      tags: [Authority]
      summary: Create a local DelegationToken
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonObject"

  /sessions:
    post:
      operationId: createLocalSession
      tags: [Authority]
      summary: Create a scoped SessionGrant
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonObject"

  /sessions/{id}:
    get:
      operationId: getLocalSession
      tags: [Authority]
      summary: Read a local SessionGrant
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
        "404":
          $ref: "#/components/responses/Error"

  /sessions/{id}/verify:
    post:
      operationId: verifyLocalSession
      tags: [Authority]
      summary: Verify a local SessionGrant
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /invoke:
    post:
      operationId: invokeLocalCapability
      tags: [Authority]
      summary: Invoke a capability through a verified SessionGrant
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /evidence:
    post:
      operationId: appendLocalEvidence
      tags: [Evidence]
      summary: Append a local evidence event
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonObject"
    get:
      operationId: listLocalEvidence
      tags: [Evidence]
      summary: List local evidence events
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /evidence/{id}:
    get:
      operationId: getLocalEvidenceEvent
      tags: [Evidence]
      summary: Inspect a local evidence event
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
        "404":
          $ref: "#/components/responses/Error"

  /evidence/verify:
    post:
      operationId: verifyLocalEvidence
      tags: [Evidence]
      summary: Verify the local evidence hash chain
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /evidence/export:
    post:
      operationId: exportLocalEvidence
      tags: [Evidence]
      summary: Export privacy-aware local evidence
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /revocations:
    post:
      operationId: recordLocalRevocation
      tags: [Authority]
      summary: Record a local revocation
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonObject"
    get:
      operationId: listLocalRevocations
      tags: [Authority]
      summary: List local revocations
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /revocations/{id}:
    get:
      operationId: getLocalRevocation
      tags: [Authority]
      summary: Inspect a local revocation
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
        "404":
          $ref: "#/components/responses/Error"

  /incidents:
    post:
      operationId: recordLocalIncident
      tags: [Authority]
      summary: Record a local incident
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonObject"
    get:
      operationId: listLocalIncidents
      tags: [Authority]
      summary: List local incidents
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /incidents/{id}:
    get:
      operationId: getLocalIncident
      tags: [Authority]
      summary: Inspect a local incident
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
        "404":
          $ref: "#/components/responses/Error"

  /incidents/{id}/resolve:
    post:
      operationId: resolveLocalIncident
      tags: [Authority]
      summary: Resolve a local incident
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /killswitch:
    post:
      operationId: createLocalKillSwitchRule
      tags: [Kill Switch]
      summary: Enable a local kill switch rule
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonObject"
    get:
      operationId: listLocalKillSwitchRules
      tags: [Kill Switch]
      summary: List local kill switch rules
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /killswitch/{id}:
    delete:
      operationId: disableLocalKillSwitchRule
      tags: [Kill Switch]
      summary: Disable a local kill switch rule
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /dht/start:
    post:
      operationId: startLocalDht
      tags: [Discovery]
      summary: Start the local DHT simulator
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /dht/publish:
    post:
      operationId: publishLocalDhtPointer
      tags: [Discovery]
      summary: Publish a signed local DHT capability pointer
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonObject"

  /dht/find:
    get:
      operationId: findLocalDhtPointers
      tags: [Discovery]
      summary: Find local DHT pointers by capability
      parameters:
        - name: capability
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
    post:
      operationId: postFindLocalDhtPointers
      tags: [Discovery]
      summary: Find local DHT pointers by request body
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /registry/start:
    post:
      operationId: startLocalRegistry
      tags: [Discovery]
      summary: Start the local registry mode
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /registry/publish:
    post:
      operationId: publishLocalRegistryRecord
      tags: [Discovery]
      summary: Publish a local registry record
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonObject"

  /registry/search:
    post:
      operationId: searchLocalRegistry
      tags: [Discovery]
      summary: Search local registry records
      requestBody:
        $ref: "#/components/requestBodies/DiscoveryQuery"
      responses:
        "200":
          $ref: "#/components/responses/Discovery"

  /registry/index:
    get:
      operationId: getLocalRegistryIndex
      tags: [Discovery]
      summary: Read the local registry index
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /relay/start:
    post:
      operationId: startLocalRelay
      tags: [Discovery]
      summary: Start the local relay simulator
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /relay/register:
    post:
      operationId: registerLocalRelayPresence
      tags: [Discovery]
      summary: Register local relay presence
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonObject"

  /relay/discover:
    post:
      operationId: discoverLocalRelayPresence
      tags: [Discovery]
      summary: Discover local relay presence
      requestBody:
        $ref: "#/components/requestBodies/DiscoveryQuery"
      responses:
        "200":
          $ref: "#/components/responses/Discovery"

  /.well-known/fides.json:
    get:
      operationId: getWellKnownFides
      tags: [Discovery]
      summary: Read the local FIDES well-known document
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /.well-known/agents.json:
    get:
      operationId: getWellKnownAgents
      tags: [Discovery]
      summary: Read local well-known agent index
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /.well-known/agents/{id}.json:
    get:
      operationId: getWellKnownAgent
      tags: [Discovery]
      summary: Read a local well-known AgentCard document
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /demo/run:
    post:
      operationId: runLocalDemo
      tags: [Authority]
      summary: Run the full local Agent Trust Fabric demo
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /simulate/adversarial:
    post:
      operationId: runAdversarialSimulation
      tags: [Authority]
      summary: Run local adversarial simulation scenarios
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"

  /v1/identities/{did}:
    get:
      operationId: resolveIdentity
      tags: [Identity]
      summary: Resolve identity via discovery proxy
      description: Proxy request to the discovery service for identity resolution.
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Identity resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResolutionResponse"
        "404":
          description: Identity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResolutionResponse"
        "502":
          description: Discovery service unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResolutionResponse"

  /v1/identities/domain/verify:
    get:
      operationId: verifyIdentityDomain
      tags: [Identity]
      summary: Verify a domain-to-DID DNS binding
      description: Resolves `_fides.<domain>` TXT records and checks for an exact `fides-did=<did>` token.
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
          example: example.com
        - name: did
          in: query
          required: true
          schema:
            type: string
          example: "did:fides:agentd-test-01"
      responses:
        "200":
          description: Domain binding verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerificationResponse"
        "400":
          description: Missing query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Domain binding was not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerificationResponse"

  /v1/cards/{did}:
    get:
      operationId: getAgentCard
      tags: [Card]
      summary: Get AgentCard via registry proxy
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Card found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
        "404":
          description: Card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
        "403":
          description: Registry card is private
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
        "502":
          description: Registry unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"

  /v1/trust/{did}/score:
    get:
      operationId: getTrustScore
      tags: [Trust]
      summary: Get trust score via trust-graph proxy
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Trust score (returns default 0.5 on failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustScoreResponse"

  /v1/policy/evaluate:
    post:
      operationId: evaluatePolicy
      tags: [Policy]
      summary: Evaluate a policy bundle
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyEvaluationRequest"
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyEvaluationResponse"

  /v1/sessions:
    post:
      operationId: createSession
      tags: [Authority]
      summary: Create a delegated session
      security:
        - ApiKeyAuth: []
      description: |
        Creates a local SessionGrant from a DelegationToken. In production,
        or whenever `AGENTD_REQUIRE_AUTHORITY_SIGNATURE_VERIFICATION=true`,
        the request must include `delegatorPublicKey` so agentd can verify
        the DelegationToken before storing the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Delegation rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityErrorResponse"

  /v1/sessions/{id}:
    get:
      operationId: getSession
      tags: [Authority]
      summary: Get a delegated session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionLookupResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/sessions/{id}/revoke:
    post:
      operationId: revokeSession
      tags: [Authority]
      summary: Revoke a delegated session
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRevokeRequest"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevokeResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/revocations:
    post:
      operationId: recordRevocation
      tags: [Authority]
      summary: Record a signed revocation
      security:
        - ApiKeyAuth: []
      description: |
        Stores a signed RevocationRecord locally and propagates it to
        trust-graph. In production, or whenever authority signature
        verification is required, `revokerPublicKey` must be included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevocationSubmitRequest"
      responses:
        "201":
          description: Revocation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevocationSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/revocations/{did}:
    get:
      operationId: getRevocation
      tags: [Authority]
      summary: Get revocation status for a DID
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Revocation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevocationStatusResponse"

  /v1/incidents:
    post:
      operationId: recordIncident
      tags: [Authority]
      summary: Record a signed incident
      security:
        - ApiKeyAuth: []
      description: |
        Stores a signed IncidentRecord locally and propagates it to
        trust-graph. In production, or whenever authority signature
        verification is required, `reporterPublicKey` must be included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentSubmitRequest"
      responses:
        "201":
          description: Incident recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/incidents/{did}:
    get:
      operationId: listIncidents
      tags: [Authority]
      summary: List incidents for a DID
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Incident list and aggregate impact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentListResponse"

  /v1/authorize:
    post:
      operationId: authorizeAction
      tags: [Authority]
      summary: Evaluate unified authorization for an agent action
      security:
        - ApiKeyAuth: []
      description: |
        Combines optional delegated session checks, local revocations,
        incident impact, policy evaluation, runtime trust context, and kill
        switch state before returning an allow, deny, or approval-required
        decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationRequest"
      responses:
        "200":
          description: Authorization allowed or approval required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Authorization denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationResponse"

  /v1/evidence:
    post:
      operationId: submitEvidence
      tags: [Evidence]
      summary: Submit evidence event
      security:
        - ApiKeyAuth: []
      description: |
        Appends an evidence event to the chain for a given actor DID.
        Events are hash-chained and Merkle-rooted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceSubmitRequest"
      responses:
        "201":
          description: Evidence accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/evidence/{did}:
    get:
      operationId: getEvidence
      tags: [Evidence]
      summary: Retrieve evidence chain for a DID
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Evidence chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceChainResponse"

  /v1/evidence/{did}/verify:
    get:
      operationId: verifyEvidence
      tags: [Evidence]
      summary: Verify evidence chain integrity for a DID
      description: |
        Returns evidence chain integrity metadata without returning full event payloads.
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Evidence chain verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceVerificationResponse"

  /v1/authority/propagations/pending:
    get:
      operationId: listPendingAuthorityPropagations
      tags: [Authority]
      summary: List due authority propagation retries
      description: |
        Returns failed revocation and incident propagation attempts that are due
        for retry against the trust-graph service.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 25
      responses:
        "200":
          description: Pending propagation records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityPropagationListResponse"

  /v1/authority/propagations/retry:
    post:
      operationId: retryAuthorityPropagations
      tags: [Authority]
      summary: Retry due authority propagations
      security:
        - ApiKeyAuth: []
      description: |
        Replays due revocation and incident propagation records to trust-graph,
        updates outbox status, and appends local evidence for each attempt.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorityPropagationRetryRequest"
      responses:
        "200":
          description: Retry summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityPropagationRetryResponse"

  /v1/attest:
    post:
      operationId: createAttestation
      tags: [Attestation]
      summary: Create runtime attestation
      security:
        - ApiKeyAuth: []
      description: |
        Generates a TEE runtime attestation using the configured attestation
        provider (mock provider in development).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttestationRequest"
      responses:
        "201":
          description: Attestation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAttestation"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/killswitch/status:
    get:
      operationId: getKillSwitchStatus
      tags: [Kill Switch]
      summary: Get kill switch status
      responses:
        "200":
          description: Kill switch state
          content:
            application/json:
              schema:
                type: object
                properties:
                  global:
                    type: boolean

  /v1/killswitch/engage:
    post:
      operationId: engageKillSwitch
      tags: [Kill Switch]
      summary: Engage kill switch
      security:
        - ApiKeyAuth: []
      description: |
        Engage a kill switch at global, agent, or capability level.
        Global overrides all. Agent overrides capability for that agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KillSwitchRequest"
      responses:
        "200":
          description: Kill switch engaged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillSwitchResponse"

  /v1/killswitch/disengage:
    post:
      operationId: disengageKillSwitch
      tags: [Kill Switch]
      summary: Disengage kill switch
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KillSwitchRequest"
      responses:
        "200":
          description: Kill switch disengaged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillSwitchResponse"

  /discover/federation:
    post:
      operationId: discoverFederation
      tags: [Discovery]
      summary: Discover candidates through federated registry peers
      description: |
        Queries local mock federation peers for capability candidates.
        Federation expands discovery only; returned candidates are marked
        `authority: candidate_only` and never grant invocation authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryQuery"
      responses:
        "200":
          description: Federation candidates and rejected candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"

  /metrics:
    get:
      operationId: getMetrics
      tags: [Health]
      summary: Prometheus metrics
      responses:
        "200":
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Required for mutating `/v1/*` endpoints when `SERVICE_API_KEY` or
        `AGENTD_API_KEYS` is configured. Legacy `SERVICE_API_KEY` grants full
        mutating access. Scoped `AGENTD_API_KEYS` can grant
        `agentd:policy:evaluate`, `agentd:sessions:write`,
        `agentd:authority:write`, `agentd:authorize:write`,
        `agentd:evidence:write`, `agentd:attest:write`,
        `agentd:killswitch:write`, or `*`.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string

    DidParam:
      name: did
      in: path
      required: true
      schema:
        type: string
      example: "did:fides:agentd-test-01"

  requestBodies:
    JsonObject:
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonObject"

    DiscoveryQuery:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiscoveryQuery"

  responses:
    JsonObject:
      description: JSON response body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonObject"

    Discovery:
      description: Candidate-only discovery response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiscoveryResponse"

    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    JsonObject:
      type: object
      additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        service:
          type: string
          example: agentd
        uptime:
          type: integer
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          properties:
            discovery:
              type: string
              enum: [connected, unreachable]
            trustGraph:
              type: string
              enum: [connected, unreachable]
            registry:
              type: string
              enum: [connected, unreachable]
            authorityStore:
              type: string
              enum: [ready, unavailable]
        authorityStore:
          type: object
          properties:
            kind:
              type: string
              enum: [memory, file, postgres]
            detail:
              type: string

    IdentityResolutionResponse:
      type: object
      properties:
        did:
          type: string
        status:
          type: string
          enum: [resolved, not-found, unreachable]
        data:
          type: object
        error:
          type: string
        service:
          type: string

    DomainVerificationResponse:
      type: object
      required: [domain, did, recordName, verified]
      properties:
        domain:
          type: string
          example: example.com
        did:
          type: string
          example: "did:fides:agentd-test-01"
        recordName:
          type: string
          example: _fides.example.com
        verified:
          type: boolean
        reason:
          type: string
          enum: [invalid-domain, invalid-did, record-not-found, resolver-error]

    DiscoveryQuery:
      type: object
      properties:
        capability:
          type: string
          example: invoice.reconcile
        constraints:
          type: object
        supported_versions:
          type: array
          items:
            type: string
          example: ["fides.v2.0"]
        required_versions:
          type: array
          items:
            type: string
          example: ["fides.v2.0"]
        limit:
          type: integer
          minimum: 1

    DiscoveryCandidate:
      type: object
      properties:
        provider:
          type: string
        agentId:
          type: string
        capability:
          type: string
        authority:
          type: string
          enum: [candidate_only]
        verified:
          type: boolean
        rank:
          type: number
        evidence_refs:
          type: array
          items:
            type: string
        explanations:
          type: array
          items:
            type: string

    LocalAgentRegistration:
      type: object
      required: [agentId, cardId, registeredAt, signed, verified, authority, authorityGranted, reasons]
      properties:
        registered:
          type: boolean
          enum: [true]
          description: Present on POST /agents/register responses.
        agentId:
          type: string
        cardId:
          type: string
        registeredAt:
          type: string
          format: date-time
        signed:
          type: boolean
          description: Whether the local AgentCard has an identity-bound canonical signature.
        verified:
          type: boolean
          description: True only when the local registration is backed by an identity-bound signed AgentCard.
        authority:
          type: string
          enum: [candidate_only]
        capabilities:
          type: array
          items:
            type: string
        authorityGranted:
          type: boolean
          enum: [false]
        reasons:
          type: array
          items:
            type: string
          example:
            - identity_bound_signed_agent_card_verified
            - local_registration_candidate_only
            - discovery_does_not_grant_authority
        reason:
          type: string
          description: Human-readable registration note returned by POST /agents/register.

    LocalAgentListResponse:
      type: object
      required: [agents, authorityGranted]
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/LocalAgentRegistration"
        authorityGranted:
          type: boolean
          enum: [false]

    LocalAgentDetailResponse:
      allOf:
        - $ref: "#/components/schemas/LocalAgentRegistration"
        - type: object
          properties:
            card:
              type: object
              nullable: true
            signedCard:
              type: object
              nullable: true

    DiscoveryResponse:
      type: object
      required: [authorityGranted]
      properties:
        provider:
          type: string
          example: federation
        capability:
          type: string
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryCandidate"
        rejectedCandidates:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryCandidate"
        authorityGranted:
          type: boolean
          enum: [false]
        explanation:
          type: string

    CardResponse:
      type: object
      properties:
        did:
          type: string
        card:
          type: object
        error:
          type: string

    TrustScoreResponse:
      type: object
      properties:
        did:
          type: string
        score:
          type: number
        directTrusters:
          type: integer
        transitiveTrusters:
          type: integer
        source:
          type: string
          enum: [default, fallback]

    PolicyEvaluationRequest:
      type: object
      properties:
        agentDid:
          type: string
        capabilityId:
          type: string
        policy:
          $ref: "#/components/schemas/PolicyBundle"
        context:
          type: object

    PolicyBundle:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRule"
        defaultAction:
          type: string
          enum: [allow, deny, approve-required]

    PolicyRule:
      type: object
      properties:
        id:
          type: string
        condition:
          type: object
        action:
          type: string
          enum: [allow, deny, approve-required, dry-run]
        explanation:
          type: string

    PolicyEvaluationResponse:
      type: object
      properties:
        decision:
          type: string
        matchedRules:
          type: array
          items:
            type: object
        explanation:
          type: object

    FidesPolicyDecision:
      type: object
      properties:
        schema_version:
          type: string
          enum: [fides.policy.decision.v1]
        id:
          type: string
        issuer:
          type: string
        subject:
          type: string
        decision:
          type: string
          enum: [allow, deny, require_approval, dry_run_only, scope_limit, risk_limit]
        principal_id:
          type: string
        requester_agent_id:
          type: string
        target_agent_id:
          type: string
        capability:
          type: string
        reason_codes:
          type: array
          items:
            type: string
        machine_reasons:
          type: array
          items:
            type: object
        human_reasons:
          type: array
          items:
            type: string
        required_controls:
          type: array
          items:
            type: string
            enum: [dry_run, human_approval, policy_proof, runtime_attestation, scope_limit, rate_limit]
        evidence_refs:
          type: array
          items:
            type: string
        issued_at:
          type: string
          format: date-time
        evaluated_at:
          type: string
          format: date-time
        payload_hash:
          type: string

    LocalPolicyEvaluationResponse:
      type: object
      properties:
        policy:
          $ref: "#/components/schemas/FidesPolicyDecision"
        trust:
          type: object
        authorityGranted:
          type: boolean
          enum: [false]
        requiresSessionGrant:
          type: boolean
        explanation:
          type: string

    EvidenceSubmitRequest:
      type: object
      required: [actor, action]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          default: custom
        actor:
          type: string
          description: "DID of the actor (alias: did)"
        action:
          type: string
        target:
          type: string
        payload:
          type: object
        privacy:
          $ref: "#/components/schemas/EvidencePrivacy"
        signature:
          type: string

    EvidencePrivacy:
      type: object
      properties:
        level:
          type: string
          enum: [public, private, redacted, hash_only]
        redactionKey:
          type: string

    EvidenceSubmitResponse:
      type: object
      properties:
        accepted:
          type: boolean
        id:
          type: string
          description: Hash of the appended event

    EvidenceChainResponse:
      type: object
      properties:
        did:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceEvent"
        count:
          type: integer
        valid:
          type: boolean
          description: Hash chain integrity verified
        merkleRoot:
          type: string

    EvidenceVerificationResponse:
      type: object
      properties:
        did:
          type: string
        valid:
          type: boolean
          description: Hash chain integrity verified
        count:
          type: integer
        merkleRoot:
          type: string
          nullable: true
        lastHash:
          type: string
          nullable: true
        checkedAt:
          type: string
          format: date-time

    EvidenceEvent:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        payload: {}
        privacy:
          $ref: "#/components/schemas/EvidencePrivacy"
        prevHash:
          type: string
        hash:
          type: string
        signature:
          type: string

    DelegationToken:
      type: object
      required: [id, delegator, delegatee, capabilities, constraints, issuedAt, expiresAt, nonce, signature]
      properties:
        id:
          type: string
        delegator:
          type: string
        delegatee:
          type: string
        capabilities:
          type: array
          items:
            type: string
        constraints:
          type: object
          properties:
            maxActions:
              type: integer
            maxSpend:
              type: string
            allowedContexts:
              type: array
              items:
                type: string
            forbiddenContexts:
              type: array
              items:
                type: string
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        nonce:
          type: string
        audience:
          type: array
          items:
            type: string
        signature:
          type: string
          description: Hex-encoded Ed25519 signature over the canonical token body

    SessionGrant:
      type: object
      properties:
        id:
          type: string
        token:
          $ref: "#/components/schemas/DelegationToken"
        sessionKey:
          type: string
          example: redacted
        expiresAt:
          type: string
          format: date-time
        boundTo:
          type: string
        createdAt:
          type: string
          format: date-time
        revoked:
          type: boolean
        revokedAt:
          type: string
          format: date-time
        revocationReason:
          type: string

    SessionCreateRequest:
      type: object
      required: [token, capabilityId]
      properties:
        token:
          $ref: "#/components/schemas/DelegationToken"
        capabilityId:
          type: string
        audience:
          type: string
          default: agentd
        boundTo:
          type: string
        ttlMs:
          type: integer
        delegatorPublicKey:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
          description: Delegator Ed25519 public key. Required when `AGENTD_REQUIRE_AUTHORITY_SIGNATURE_VERIFICATION=true`.

    SessionCreateResponse:
      type: object
      properties:
        authorized:
          type: boolean
        session:
          $ref: "#/components/schemas/SessionGrant"

    SessionLookupResponse:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/SessionGrant"

    SessionRevokeRequest:
      type: object
      properties:
        reason:
          type: string

    SessionRevokeResponse:
      type: object
      properties:
        revoked:
          type: boolean
        session:
          $ref: "#/components/schemas/SessionGrant"

    RevocationRecord:
      type: object
      required: [id, did, reason, revokedAt, revokedBy, signature, propagatedTo]
      properties:
        id:
          type: string
        did:
          type: string
        reason:
          type: string
        revokedAt:
          type: string
          format: date-time
        revokedBy:
          type: string
        signature:
          type: string
          description: Hex-encoded Ed25519 signature over the canonical revocation body
        propagatedTo:
          type: array
          items:
            type: string

    RevocationSubmitRequest:
      type: object
      required: [record]
      properties:
        record:
          $ref: "#/components/schemas/RevocationRecord"
        revokerPublicKey:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
          description: Revoker Ed25519 public key. Required when `AGENTD_REQUIRE_AUTHORITY_SIGNATURE_VERIFICATION=true`.

    RevocationSubmitResponse:
      type: object
      properties:
        revoked:
          type: boolean
        record:
          $ref: "#/components/schemas/RevocationRecord"
        propagation:
          $ref: "#/components/schemas/AuthorityPropagationResponse"

    RevocationStatusResponse:
      type: object
      properties:
        did:
          type: string
        revoked:
          type: boolean
        record:
          $ref: "#/components/schemas/RevocationRecord"

    IncidentRecord:
      type: object
      required: [id, type, severity, actor, reportedBy, description, evidenceRefs, reportedAt, impact, signature]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [compromise, misbehavior, policy_violation, runtime_failure, sybil]
        severity:
          type: string
          enum: [low, medium, high, critical]
        actor:
          type: string
        reportedBy:
          type: string
        description:
          type: string
        evidenceRefs:
          type: array
          items:
            type: string
        reportedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        impact:
          $ref: "#/components/schemas/IncidentImpact"
        signature:
          type: string
          description: Hex-encoded Ed25519 signature over the canonical incident body

    IncidentImpact:
      type: object
      properties:
        trustPenalty:
          type: number
        reputationPenalty:
          type: number
        capabilitiesRevoked:
          type: array
          items:
            type: string

    IncidentAggregateImpact:
      allOf:
        - $ref: "#/components/schemas/IncidentImpact"
        - type: object
          properties:
            incidentCount:
              type: integer
            criticalCount:
              type: integer
            allRevokedCapabilities:
              type: array
              items:
                type: string

    IncidentSubmitRequest:
      type: object
      required: [record]
      properties:
        record:
          $ref: "#/components/schemas/IncidentRecord"
        reporterPublicKey:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
          description: Reporter Ed25519 public key. Required when `AGENTD_REQUIRE_AUTHORITY_SIGNATURE_VERIFICATION=true`.

    IncidentSubmitResponse:
      type: object
      properties:
        recorded:
          type: boolean
        record:
          $ref: "#/components/schemas/IncidentRecord"
        impact:
          $ref: "#/components/schemas/IncidentAggregateImpact"
        propagation:
          $ref: "#/components/schemas/AuthorityPropagationResponse"

    IncidentListResponse:
      type: object
      properties:
        did:
          type: string
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/IncidentRecord"
        impact:
          $ref: "#/components/schemas/IncidentAggregateImpact"

    AuthorizationRequest:
      type: object
      required: [agentDid, capabilityId]
      properties:
        agentDid:
          type: string
        capabilityId:
          type: string
        sessionId:
          type: string
        audience:
          type: string
        policy:
          $ref: "#/components/schemas/PolicyBundle"
        context:
          type: object
        attestationValid:
          type: boolean
        reputationScore:
          type: number
          description: Non-production simulation input. In production, agentd reads this from trust-graph.
        capabilityScore:
          type: number
          description: Non-production simulation input. In production, agentd reads this from trust-graph.
        capabilityHighRisk:
          type: boolean
        requiresRuntimeAttestation:
          type: boolean
        requiresApproval:
          type: boolean
        approvalGranted:
          type: boolean
          description: Ignored in production until an authoritative approval store is configured.

    AuthorizationResponse:
      type: object
      properties:
        decision:
          type: string
          enum: [allow, deny, approve-required, dry-run]
        explanation:
          type: string
        factors:
          type: array
          items:
            type: string
        session:
          $ref: "#/components/schemas/SessionGrant"
        incidentImpact:
          $ref: "#/components/schemas/IncidentAggregateImpact"
        revoked:
          type: boolean

    AuthorityErrorResponse:
      type: object
      properties:
        authorized:
          type: boolean
        errors:
          type: array
          items:
            type: string

    AuthorityPropagationResponse:
      type: object
      properties:
        attempted:
          type: boolean
        ok:
          type: boolean
        status:
          type: integer
        target:
          type: string
          example: trust-graph
        path:
          type: string
        attemptedAt:
          type: string
          format: date-time
        error:
          type: string
        queued:
          type: boolean
        outboxId:
          type: string
        attempts:
          type: integer

    AuthorityPropagationRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
        recordType:
          type: string
          enum: [revocation, incident]
        recordId:
          type: string
        target:
          type: string
          example: trust-graph
        path:
          type: string
          example: /v1/revocations
        body:
          type: object
        status:
          type: string
          enum: [pending, confirmed, failed]
        attempts:
          type: integer
        maxAttempts:
          type: integer
        nextAttemptAt:
          type: string
          format: date-time
        lastAttemptAt:
          type: string
          format: date-time
        lastStatus:
          type: integer
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthorityPropagationListResponse:
      type: object
      properties:
        count:
          type: integer
        propagations:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityPropagationRecord"

    AuthorityPropagationRetryRequest:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          default: 25

    AuthorityPropagationRetryResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ok:
          type: boolean
        status:
          type: integer
        attempts:
          type: integer
        outboxStatus:
          type: string
          enum: [pending, confirmed, failed]
        nextAttemptAt:
          type: string
          format: date-time
        error:
          type: string

    AuthorityPropagationRetryResponse:
      type: object
      properties:
        attempted:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityPropagationRetryResult"

    AttestationRequest:
      type: object
      required: [did]
      properties:
        did:
          type: string
          description: "DID of the agent (alias: agentDid)"
        agentDid:
          type: string

    RuntimeAttestation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agentDid:
          type: string
        provider:
          type: string
          example: mock-tee
        measurement:
          type: string
        timestamp:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        evidence: {}
        signature:
          type: string

    KillSwitchRequest:
      type: object
      properties:
        global:
          type: boolean
        did:
          type: string
        capabilityId:
          type: string

    KillSwitchResponse:
      type: object
      properties:
        engaged:
          type: boolean
        scope:
          type: string
          enum: [global, agent, capability, all]
        did:
          type: string
        id:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
