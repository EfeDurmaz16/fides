openapi: "3.0.3"
info:
  title: FIDES Agent Daemon (agentd)
  version: "2.0.0"
  description: |
    Local daemon providing a unified HTTP API that proxies to the FIDES
    trust fabric services (discovery, trust-graph, registry). Includes
    local services for evidence logging, policy evaluation, runtime
    attestation, and emergency kill switch.
  contact:
    name: FIDES Protocol
    url: https://github.com/EfeDurmaz16/fides

servers:
  - url: http://localhost:7345
    description: Local development
  - url: https://agentd.fides.example.com
    description: Production

tags:
  - name: Health
  - name: Identity
  - name: Card
  - name: Trust
  - name: Policy
  - name: Evidence
  - name: Authority
  - name: Attestation
  - name: Kill Switch

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Service health check
      description: Probes all upstream services (discovery, trust-graph, registry).
      responses:
        "200":
          description: All upstream services reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more upstream services unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/identities/{did}:
    get:
      operationId: resolveIdentity
      tags: [Identity]
      summary: Resolve identity via discovery proxy
      description: Proxy request to the discovery service for identity resolution.
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Identity resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResolutionResponse"
        "404":
          description: Identity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResolutionResponse"
        "502":
          description: Discovery service unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResolutionResponse"

  /v1/identities/domain/verify:
    get:
      operationId: verifyIdentityDomain
      tags: [Identity]
      summary: Verify a domain-to-DID DNS binding
      description: Resolves `_fides.<domain>` TXT records and checks for an exact `fides-did=<did>` token.
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
          example: example.com
        - name: did
          in: query
          required: true
          schema:
            type: string
          example: "did:fides:agentd-test-01"
      responses:
        "200":
          description: Domain binding verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerificationResponse"
        "400":
          description: Missing query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Domain binding was not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerificationResponse"

  /v1/cards/{did}:
    get:
      operationId: getAgentCard
      tags: [Card]
      summary: Get AgentCard via registry proxy
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Card found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
        "404":
          description: Card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
        "403":
          description: Registry card is private
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
        "502":
          description: Registry unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"

  /v1/trust/{did}/score:
    get:
      operationId: getTrustScore
      tags: [Trust]
      summary: Get trust score via trust-graph proxy
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Trust score (returns default 0.5 on failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustScoreResponse"

  /v1/policy/evaluate:
    post:
      operationId: evaluatePolicy
      tags: [Policy]
      summary: Evaluate a policy bundle
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyEvaluationRequest"
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyEvaluationResponse"

  /v1/sessions:
    post:
      operationId: createSession
      tags: [Authority]
      summary: Create a delegated session
      security:
        - ApiKeyAuth: []
      description: |
        Creates a local SessionGrant from a DelegationToken. When
        `AGENTD_REQUIRE_AUTHORITY_SIGNATURE_VERIFICATION=true`, the request
        must include `delegatorPublicKey` so agentd can verify the
        DelegationToken before storing the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Delegation rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityErrorResponse"

  /v1/sessions/{id}:
    get:
      operationId: getSession
      tags: [Authority]
      summary: Get a delegated session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionLookupResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/sessions/{id}/revoke:
    post:
      operationId: revokeSession
      tags: [Authority]
      summary: Revoke a delegated session
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRevokeRequest"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevokeResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/revocations:
    post:
      operationId: recordRevocation
      tags: [Authority]
      summary: Record a signed revocation
      security:
        - ApiKeyAuth: []
      description: |
        Stores a signed RevocationRecord locally and propagates it to
        trust-graph. When authority signature verification is required,
        `revokerPublicKey` must be included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevocationSubmitRequest"
      responses:
        "201":
          description: Revocation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevocationSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/revocations/{did}:
    get:
      operationId: getRevocation
      tags: [Authority]
      summary: Get revocation status for a DID
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Revocation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevocationStatusResponse"

  /v1/incidents:
    post:
      operationId: recordIncident
      tags: [Authority]
      summary: Record a signed incident
      security:
        - ApiKeyAuth: []
      description: |
        Stores a signed IncidentRecord locally and propagates it to
        trust-graph. When authority signature verification is required,
        `reporterPublicKey` must be included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentSubmitRequest"
      responses:
        "201":
          description: Incident recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/incidents/{did}:
    get:
      operationId: listIncidents
      tags: [Authority]
      summary: List incidents for a DID
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Incident list and aggregate impact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentListResponse"

  /v1/authorize:
    post:
      operationId: authorizeAction
      tags: [Authority]
      summary: Evaluate unified authorization for an agent action
      security:
        - ApiKeyAuth: []
      description: |
        Combines optional delegated session checks, local revocations,
        incident impact, policy evaluation, runtime trust context, and kill
        switch state before returning an allow, deny, or approval-required
        decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationRequest"
      responses:
        "200":
          description: Authorization allowed or approval required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Authorization denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationResponse"

  /v1/evidence:
    post:
      operationId: submitEvidence
      tags: [Evidence]
      summary: Submit evidence event
      security:
        - ApiKeyAuth: []
      description: |
        Appends an evidence event to the chain for a given actor DID.
        Events are hash-chained and Merkle-rooted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceSubmitRequest"
      responses:
        "201":
          description: Evidence accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/evidence/{did}:
    get:
      operationId: getEvidence
      tags: [Evidence]
      summary: Retrieve evidence chain for a DID
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Evidence chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceChainResponse"

  /v1/evidence/{did}/verify:
    get:
      operationId: verifyEvidence
      tags: [Evidence]
      summary: Verify evidence chain integrity for a DID
      description: |
        Returns evidence chain integrity metadata without returning full event payloads.
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Evidence chain verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceVerificationResponse"

  /v1/authority/propagations/pending:
    get:
      operationId: listPendingAuthorityPropagations
      tags: [Authority]
      summary: List due authority propagation retries
      description: |
        Returns failed revocation and incident propagation attempts that are due
        for retry against the trust-graph service.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 25
      responses:
        "200":
          description: Pending propagation records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityPropagationListResponse"

  /v1/authority/propagations/retry:
    post:
      operationId: retryAuthorityPropagations
      tags: [Authority]
      summary: Retry due authority propagations
      security:
        - ApiKeyAuth: []
      description: |
        Replays due revocation and incident propagation records to trust-graph,
        updates outbox status, and appends local evidence for each attempt.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorityPropagationRetryRequest"
      responses:
        "200":
          description: Retry summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityPropagationRetryResponse"

  /v1/attest:
    post:
      operationId: createAttestation
      tags: [Attestation]
      summary: Create runtime attestation
      security:
        - ApiKeyAuth: []
      description: |
        Generates a TEE runtime attestation using the configured attestation
        provider (mock provider in development).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttestationRequest"
      responses:
        "201":
          description: Attestation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAttestation"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/killswitch/status:
    get:
      operationId: getKillSwitchStatus
      tags: [Kill Switch]
      summary: Get kill switch status
      responses:
        "200":
          description: Kill switch state
          content:
            application/json:
              schema:
                type: object
                properties:
                  global:
                    type: boolean

  /v1/killswitch/engage:
    post:
      operationId: engageKillSwitch
      tags: [Kill Switch]
      summary: Engage kill switch
      security:
        - ApiKeyAuth: []
      description: |
        Engage a kill switch at global, agent, or capability level.
        Global overrides all. Agent overrides capability for that agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KillSwitchRequest"
      responses:
        "200":
          description: Kill switch engaged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillSwitchResponse"

  /v1/killswitch/disengage:
    post:
      operationId: disengageKillSwitch
      tags: [Kill Switch]
      summary: Disengage kill switch
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KillSwitchRequest"
      responses:
        "200":
          description: Kill switch disengaged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillSwitchResponse"

  /metrics:
    get:
      operationId: getMetrics
      tags: [Health]
      summary: Prometheus metrics
      responses:
        "200":
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Required for mutating `/v1/*` endpoints when `SERVICE_API_KEY` is configured.

  parameters:
    DidParam:
      name: did
      in: path
      required: true
      schema:
        type: string
      example: "did:fides:agentd-test-01"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        service:
          type: string
          example: agentd
        uptime:
          type: integer
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          properties:
            discovery:
              type: string
              enum: [connected, unreachable]
            trustGraph:
              type: string
              enum: [connected, unreachable]
            registry:
              type: string
              enum: [connected, unreachable]
            authorityStore:
              type: string
              enum: [ready, unavailable]
        authorityStore:
          type: object
          properties:
            kind:
              type: string
              enum: [memory, file, postgres]
            detail:
              type: string

    IdentityResolutionResponse:
      type: object
      properties:
        did:
          type: string
        status:
          type: string
          enum: [resolved, not-found, unreachable]
        data:
          type: object
        error:
          type: string
        service:
          type: string

    DomainVerificationResponse:
      type: object
      required: [domain, did, recordName, verified]
      properties:
        domain:
          type: string
          example: example.com
        did:
          type: string
          example: "did:fides:agentd-test-01"
        recordName:
          type: string
          example: _fides.example.com
        verified:
          type: boolean
        reason:
          type: string
          enum: [invalid-domain, invalid-did, record-not-found, resolver-error]

    CardResponse:
      type: object
      properties:
        did:
          type: string
        card:
          type: object
        error:
          type: string

    TrustScoreResponse:
      type: object
      properties:
        did:
          type: string
        score:
          type: number
        directTrusters:
          type: integer
        transitiveTrusters:
          type: integer
        source:
          type: string
          enum: [default, fallback]

    PolicyEvaluationRequest:
      type: object
      properties:
        agentDid:
          type: string
        capabilityId:
          type: string
        policy:
          $ref: "#/components/schemas/PolicyBundle"
        context:
          type: object

    PolicyBundle:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRule"
        defaultAction:
          type: string
          enum: [allow, deny, approve-required]

    PolicyRule:
      type: object
      properties:
        id:
          type: string
        condition:
          type: object
        action:
          type: string
          enum: [allow, deny, approve-required, dry-run]
        explanation:
          type: string

    PolicyEvaluationResponse:
      type: object
      properties:
        decision:
          type: string
        matchedRules:
          type: array
          items:
            type: object
        explanation:
          type: object

    EvidenceSubmitRequest:
      type: object
      required: [actor, action]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          default: custom
        actor:
          type: string
          description: "DID of the actor (alias: did)"
        action:
          type: string
        target:
          type: string
        payload:
          type: object
        privacy:
          $ref: "#/components/schemas/EvidencePrivacy"
        signature:
          type: string

    EvidencePrivacy:
      type: object
      properties:
        level:
          type: string
          enum: [public, private, redacted, hash-only]
        redactionKey:
          type: string

    EvidenceSubmitResponse:
      type: object
      properties:
        accepted:
          type: boolean
        id:
          type: string
          description: Hash of the appended event

    EvidenceChainResponse:
      type: object
      properties:
        did:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceEvent"
        count:
          type: integer
        valid:
          type: boolean
          description: Hash chain integrity verified
        merkleRoot:
          type: string

    EvidenceVerificationResponse:
      type: object
      properties:
        did:
          type: string
        valid:
          type: boolean
          description: Hash chain integrity verified
        count:
          type: integer
        merkleRoot:
          type: string
          nullable: true
        lastHash:
          type: string
          nullable: true
        checkedAt:
          type: string
          format: date-time

    EvidenceEvent:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        payload: {}
        privacy:
          $ref: "#/components/schemas/EvidencePrivacy"
        prevHash:
          type: string
        hash:
          type: string
        signature:
          type: string

    DelegationToken:
      type: object
      required: [id, delegator, delegatee, capabilities, constraints, issuedAt, expiresAt, nonce, signature]
      properties:
        id:
          type: string
        delegator:
          type: string
        delegatee:
          type: string
        capabilities:
          type: array
          items:
            type: string
        constraints:
          type: object
          properties:
            maxActions:
              type: integer
            maxSpend:
              type: string
            allowedContexts:
              type: array
              items:
                type: string
            forbiddenContexts:
              type: array
              items:
                type: string
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        nonce:
          type: string
        audience:
          type: array
          items:
            type: string
        signature:
          type: string
          description: Hex-encoded Ed25519 signature over the canonical token body

    SessionGrant:
      type: object
      properties:
        id:
          type: string
        token:
          $ref: "#/components/schemas/DelegationToken"
        sessionKey:
          type: string
          example: redacted
        expiresAt:
          type: string
          format: date-time
        boundTo:
          type: string
        createdAt:
          type: string
          format: date-time
        revoked:
          type: boolean
        revokedAt:
          type: string
          format: date-time
        revocationReason:
          type: string

    SessionCreateRequest:
      type: object
      required: [token, capabilityId]
      properties:
        token:
          $ref: "#/components/schemas/DelegationToken"
        capabilityId:
          type: string
        audience:
          type: string
          default: agentd
        boundTo:
          type: string
        ttlMs:
          type: integer
        delegatorPublicKey:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
          description: Delegator Ed25519 public key. Required when `AGENTD_REQUIRE_AUTHORITY_SIGNATURE_VERIFICATION=true`.

    SessionCreateResponse:
      type: object
      properties:
        authorized:
          type: boolean
        session:
          $ref: "#/components/schemas/SessionGrant"

    SessionLookupResponse:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/SessionGrant"

    SessionRevokeRequest:
      type: object
      properties:
        reason:
          type: string

    SessionRevokeResponse:
      type: object
      properties:
        revoked:
          type: boolean
        session:
          $ref: "#/components/schemas/SessionGrant"

    RevocationRecord:
      type: object
      required: [id, did, reason, revokedAt, revokedBy, signature, propagatedTo]
      properties:
        id:
          type: string
        did:
          type: string
        reason:
          type: string
        revokedAt:
          type: string
          format: date-time
        revokedBy:
          type: string
        signature:
          type: string
          description: Hex-encoded Ed25519 signature over the canonical revocation body
        propagatedTo:
          type: array
          items:
            type: string

    RevocationSubmitRequest:
      type: object
      required: [record]
      properties:
        record:
          $ref: "#/components/schemas/RevocationRecord"
        revokerPublicKey:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
          description: Revoker Ed25519 public key. Required when `AGENTD_REQUIRE_AUTHORITY_SIGNATURE_VERIFICATION=true`.

    RevocationSubmitResponse:
      type: object
      properties:
        revoked:
          type: boolean
        record:
          $ref: "#/components/schemas/RevocationRecord"
        propagation:
          $ref: "#/components/schemas/AuthorityPropagationResponse"

    RevocationStatusResponse:
      type: object
      properties:
        did:
          type: string
        revoked:
          type: boolean
        record:
          $ref: "#/components/schemas/RevocationRecord"

    IncidentRecord:
      type: object
      required: [id, type, severity, actor, reportedBy, description, evidenceRefs, reportedAt, impact, signature]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [compromise, misbehavior, policy_violation, runtime_failure, sybil]
        severity:
          type: string
          enum: [low, medium, high, critical]
        actor:
          type: string
        reportedBy:
          type: string
        description:
          type: string
        evidenceRefs:
          type: array
          items:
            type: string
        reportedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        impact:
          $ref: "#/components/schemas/IncidentImpact"
        signature:
          type: string
          description: Hex-encoded Ed25519 signature over the canonical incident body

    IncidentImpact:
      type: object
      properties:
        trustPenalty:
          type: number
        reputationPenalty:
          type: number
        capabilitiesRevoked:
          type: array
          items:
            type: string

    IncidentAggregateImpact:
      allOf:
        - $ref: "#/components/schemas/IncidentImpact"
        - type: object
          properties:
            incidentCount:
              type: integer
            criticalCount:
              type: integer
            allRevokedCapabilities:
              type: array
              items:
                type: string

    IncidentSubmitRequest:
      type: object
      required: [record]
      properties:
        record:
          $ref: "#/components/schemas/IncidentRecord"
        reporterPublicKey:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
          description: Reporter Ed25519 public key. Required when `AGENTD_REQUIRE_AUTHORITY_SIGNATURE_VERIFICATION=true`.

    IncidentSubmitResponse:
      type: object
      properties:
        recorded:
          type: boolean
        record:
          $ref: "#/components/schemas/IncidentRecord"
        impact:
          $ref: "#/components/schemas/IncidentAggregateImpact"
        propagation:
          $ref: "#/components/schemas/AuthorityPropagationResponse"

    IncidentListResponse:
      type: object
      properties:
        did:
          type: string
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/IncidentRecord"
        impact:
          $ref: "#/components/schemas/IncidentAggregateImpact"

    AuthorizationRequest:
      type: object
      required: [agentDid, capabilityId]
      properties:
        agentDid:
          type: string
        capabilityId:
          type: string
        sessionId:
          type: string
        audience:
          type: string
        policy:
          $ref: "#/components/schemas/PolicyBundle"
        context:
          type: object
        attestationValid:
          type: boolean
        reputationScore:
          type: number
        capabilityScore:
          type: number
        capabilityHighRisk:
          type: boolean
        requiresRuntimeAttestation:
          type: boolean
        requiresApproval:
          type: boolean
        approvalGranted:
          type: boolean

    AuthorizationResponse:
      type: object
      properties:
        decision:
          type: string
          enum: [allow, deny, approve-required]
        explanation:
          type: string
        factors:
          type: array
          items:
            type: string
        session:
          $ref: "#/components/schemas/SessionGrant"
        incidentImpact:
          $ref: "#/components/schemas/IncidentAggregateImpact"
        revoked:
          type: boolean

    AuthorityErrorResponse:
      type: object
      properties:
        authorized:
          type: boolean
        errors:
          type: array
          items:
            type: string

    AuthorityPropagationResponse:
      type: object
      properties:
        attempted:
          type: boolean
        ok:
          type: boolean
        status:
          type: integer
        target:
          type: string
          example: trust-graph
        path:
          type: string
        attemptedAt:
          type: string
          format: date-time
        error:
          type: string
        queued:
          type: boolean
        outboxId:
          type: string
        attempts:
          type: integer

    AuthorityPropagationRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
        recordType:
          type: string
          enum: [revocation, incident]
        recordId:
          type: string
        target:
          type: string
          example: trust-graph
        path:
          type: string
          example: /v1/revocations
        body:
          type: object
        status:
          type: string
          enum: [pending, confirmed, failed]
        attempts:
          type: integer
        maxAttempts:
          type: integer
        nextAttemptAt:
          type: string
          format: date-time
        lastAttemptAt:
          type: string
          format: date-time
        lastStatus:
          type: integer
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthorityPropagationListResponse:
      type: object
      properties:
        count:
          type: integer
        propagations:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityPropagationRecord"

    AuthorityPropagationRetryRequest:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          default: 25

    AuthorityPropagationRetryResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ok:
          type: boolean
        status:
          type: integer
        attempts:
          type: integer
        outboxStatus:
          type: string
          enum: [pending, confirmed, failed]
        nextAttemptAt:
          type: string
          format: date-time
        error:
          type: string

    AuthorityPropagationRetryResponse:
      type: object
      properties:
        attempted:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityPropagationRetryResult"

    AttestationRequest:
      type: object
      required: [did]
      properties:
        did:
          type: string
          description: "DID of the agent (alias: agentDid)"
        agentDid:
          type: string

    RuntimeAttestation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agentDid:
          type: string
        provider:
          type: string
          example: mock-tee
        measurement:
          type: string
        timestamp:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        evidence: {}
        signature:
          type: string

    KillSwitchRequest:
      type: object
      properties:
        global:
          type: boolean
        did:
          type: string
        capabilityId:
          type: string

    KillSwitchResponse:
      type: object
      properties:
        engaged:
          type: boolean
        scope:
          type: string
          enum: [global, agent, capability, all]
        did:
          type: string
        id:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
