openapi: "3.0.3"
info:
  title: FIDES Discovery Service
  version: "2.0.0"
  description: |
    Identity registration, resolution, and agent discovery for the FIDES v2
    trust fabric. Supports DID-based identity persistence, agent capability
    registry, and well-known discovery endpoints.
  contact:
    name: FIDES Protocol
    url: https://github.com/EfeDurmaz16/fides

servers:
  - url: http://localhost:3100
    description: Local development
  - url: https://discovery.fides.example.com
    description: Production

tags:
  - name: Health
  - name: Identities
  - name: Agents
  - name: Discovery

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Service health check
      responses:
        "200":
          description: All checks pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Degraded (database unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /identities:
    post:
      operationId: registerIdentity
      tags: [Identities]
      summary: Register a new identity
      description: |
        Creates a new FIDES identity. The DID must be a valid `did:fides:...` URI
        derived from the Ed25519 public key. DID-verification is enforced — the
        provided DID must match the provided public key. Requires API key
        authentication with the `X-API-Key` header. When `DISCOVERY_API_KEYS`
        is configured, the key must include `discovery:identities:register` or `*`.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterIdentityRequest"
      responses:
        "201":
          description: Identity registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: DID does not match public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Identity already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /identities/{did}:
    get:
      operationId: getIdentity
      tags: [Identities]
      summary: Resolve identity by DID
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Identity found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /identities/{did}/domain/verify:
    post:
      operationId: verifyIdentityDomain
      tags: [Identities]
      summary: Verify and persist identity domain ownership
      description: |
        Resolves `_fides.<domain>` TXT records and persists DNS verification
        only when the TXT record contains the exact `fides-did=<did>` token.
        If no request domain is supplied, the identity's stored domain is used.
        Requires API key authentication with the `X-API-Key` header. When
        `DISCOVERY_API_KEYS` is configured, the key must include
        `discovery:identities:domain:verify` or `*`.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/DidParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyIdentityDomainRequest"
      responses:
        "200":
          description: Domain verified and persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityDomainVerificationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: DNS binding was not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerificationFailureResponse"

  /identities/{did}/organization-domain/verify:
    post:
      operationId: verifyOrganizationDomain
      tags: [Identities]
      summary: Verify and persist organization domain ownership
      description: |
        Resolves `_fides-org.<domain>` TXT records and persists organization DNS
        verification only when the TXT record contains the exact
        `fides-org-did=<did>` token. If no request domain is supplied, the
        identity's stored organization domain is used. Requires API key
        authentication with the `X-API-Key` header. When `DISCOVERY_API_KEYS`
        is configured, the key must include
        `discovery:identities:organization-domain:verify` or `*`.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/DidParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOrganizationDomainRequest"
      responses:
        "200":
          description: Organization domain verified and persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDomainVerificationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: DNS binding was not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerificationFailureResponse"

  /identities/by-domain:
    get:
      operationId: lookupIdentityByDomain
      tags: [Identities]
      summary: Lookup identity by domain
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
          example: agent.example.com
      responses:
        "200":
          description: Matching identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdentityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /agents:
    get:
      operationId: searchAgents
      tags: [Agents]
      summary: Search registered agents
      parameters:
        - name: capability
          in: query
          schema:
            type: string
          example: "web:search"
        - name: status
          in: query
          schema:
            type: string
            enum: [online, offline]
        - name: tag
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of matching agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentResponse"

    post:
      operationId: registerAgent
      tags: [Agents]
      summary: Register an agent
      description: |
        Requires the identity to already exist via POST /identities. Requires
        API key authentication with the `X-API-Key` header. When
        `DISCOVERY_API_KEYS` is configured, the key must include
        `discovery:agents:register` or `*`.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAgentRequest"
      responses:
        "201":
          description: Agent registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Identity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Agent already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agents/{did}:
    get:
      operationId: getAgent
      tags: [Agents]
      summary: Get agent by DID
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Agent found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateAgent
      tags: [Agents]
      summary: Update agent registration
      description: |
        Requires API key authentication with the `X-API-Key` header. When
        `DISCOVERY_API_KEYS` is configured, the key must include
        `discovery:agents:update` or `*`.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/DidParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAgentRequest"
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deregisterAgent
      tags: [Agents]
      summary: Deregister an agent
      description: |
        Requires API key authentication with the `X-API-Key` header. When
        `DISCOVERY_API_KEYS` is configured, the key must include
        `discovery:agents:delete` or `*`.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Agent deregistered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /agents/{did}/heartbeat:
    put:
      operationId: sendHeartbeat
      tags: [Agents]
      summary: Send heartbeat signal
      description: |
        Marks the agent as online and updates heartbeat timestamp. Requires API
        key authentication with the `X-API-Key` header. When
        `DISCOVERY_API_KEYS` is configured, the key must include
        `discovery:agents:heartbeat` or `*`.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: online
                  heartbeatAt:
                    type: string
                    format: date-time

  /.well-known/fides.json:
    get:
      operationId: getDiscoveryDocument
      tags: [Discovery]
      summary: Service discovery document
      responses:
        "200":
          description: Discovery document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryDocument"

  /.well-known/agent.json:
    get:
      operationId: getAgentCardA2A
      tags: [Discovery]
      summary: A2A-compatible Agent Card
      parameters:
        - name: did
          in: query
          schema:
            type: string
          description: Specific agent DID (defaults to service DID)
      responses:
        "200":
          description: Agent card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCard"

  /metrics:
    get:
      operationId: getMetrics
      tags: [Health]
      summary: Prometheus metrics
      responses:
        "200":
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Use `SERVICE_API_KEY` for a shared service key or `DISCOVERY_API_KEYS`
        for least-privilege JSON-scoped keys. Discovery write scopes are
        `discovery:identities:register`, `discovery:identities:domain:verify`,
        `discovery:identities:organization-domain:verify`,
        `discovery:agents:register`, `discovery:agents:update`,
        `discovery:agents:heartbeat`, `discovery:agents:delete`, and `*`.

  parameters:
    DidParam:
      name: did
      in: path
      required: true
      schema:
        type: string
        example: "did:fides:CVDFLCAjXhVWiPXH9nTCTpCgVzmDVoiPzNJYuccr1dqB"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "Identity not found"

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        service:
          type: string
          example: discovery
        version:
          type: string
          example: "0.1.0"
        uptime:
          type: integer
          example: 3600
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [connected, disconnected]

    RegisterIdentityRequest:
      type: object
      required: [did, publicKey]
      properties:
        did:
          type: string
          example: "did:fides:CVDFLCAjXhVWiPXH9nTCTpCgVzmDVoiPzNJYuccr1dqB"
        publicKey:
          type: string
          description: 64-character hex-encoded Ed25519 public key
          example: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        metadata:
          type: object
        domain:
          type: string
          example: "agent.example.com"
        organizationDomain:
          type: string
          example: "example.com"

    IdentityResponse:
      type: object
      properties:
        did:
          type: string
        publicKey:
          type: string
        metadata:
          type: object
        domain:
          type: string
          nullable: true
        domainVerified:
          type: boolean
        domainVerifiedAt:
          type: string
          nullable: true
          format: date-time
        verificationMethod:
          type: string
          nullable: true
          enum: [dns]
        organizationDomain:
          type: string
          nullable: true
        organizationDomainVerified:
          type: boolean
        organizationDomainVerifiedAt:
          type: string
          nullable: true
          format: date-time
        organizationVerificationMethod:
          type: string
          nullable: true
          enum: [dns]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VerifyIdentityDomainRequest:
      type: object
      properties:
        domain:
          type: string
          description: Domain to verify. Defaults to the identity's stored domain when omitted.
          example: "agent.example.com"

    VerifyOrganizationDomainRequest:
      type: object
      properties:
        domain:
          type: string
          description: Organization domain to verify. Defaults to the identity's stored organization domain when omitted.
          example: "example.com"

    DomainVerificationResult:
      type: object
      required: [domain, did, recordName, verified]
      properties:
        domain:
          type: string
        did:
          type: string
        recordName:
          type: string
        verified:
          type: boolean
        reason:
          type: string
          enum: [invalid-domain, invalid-did, record-not-found, resolver-error]

    IdentityDomainVerificationResponse:
      allOf:
        - $ref: "#/components/schemas/IdentityResponse"
        - type: object
          required: [verification]
          properties:
            verification:
              $ref: "#/components/schemas/DomainVerificationResult"

    OrganizationDomainVerificationResponse:
      allOf:
        - $ref: "#/components/schemas/IdentityResponse"
        - type: object
          required: [verification]
          properties:
            verification:
              $ref: "#/components/schemas/DomainVerificationResult"

    DomainVerificationFailureResponse:
      allOf:
        - $ref: "#/components/schemas/DomainVerificationResult"
        - type: object
          properties:
            persisted:
              type: boolean
              enum: [false]

    RegisterAgentRequest:
      type: object
      required: [did, name]
      properties:
        did:
          type: string
        name:
          type: string
        description:
          type: string
        url:
          type: string
          description: Optional transport URL. When omitted, the service stores a local://agents/<did> hint.
        version:
          type: string
        provider:
          type: string
        capabilities:
          type: object
        skills:
          type: array
          items:
            type: object
        defaultInputModes:
          type: array
          items:
            type: string
        defaultOutputModes:
          type: array
          items:
            type: string

    AgentResponse:
      type: object
      properties:
        did:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        url:
          type: string
        version:
          type: string
        publicKey:
          type: string
        algorithm:
          type: string
          example: ed25519
        provider:
          type: string
          nullable: true
        capabilities:
          type: object
        skills:
          type: array
          items:
            type: object
        defaultInputModes:
          type: array
          nullable: true
        defaultOutputModes:
          type: array
          nullable: true
        status:
          type: string
          enum: [online, offline]
        heartbeatAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        urlRequired:
          type: boolean
          enum: [false]
          description: Agent registration and discovery do not require an HTTP URL.
        authorityGranted:
          type: boolean
          enum: [false]
          description: Discovery records are candidates only and never grant invocation authority.

    DiscoveryDocument:
      type: object
      properties:
        did:
          type: string
        publicKey:
          type: string
        algorithm:
          type: string
          example: ed25519
        endpoints:
          type: object
          properties:
            discovery:
              type: string
              format: uri
            trust:
              type: string
              format: uri
              nullable: true
        createdAt:
          type: string
          format: date-time

    AgentCard:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        url:
          type: string
        version:
          type: string
        provider:
          type: string
        capabilities:
          type: object
        skills:
          type: array
          items:
            type: object
        defaultInputModes:
          type: array
          items:
            type: string
        defaultOutputModes:
          type: array
          items:
            type: string
        securitySchemes:
          type: object
        security:
          type: array
          items:
            type: string
        x-fides-did:
          type: string
        x-fides-publicKey:
          type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: "Agent deregistered"

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      headers:
        Retry-After:
          schema:
            type: integer
