openapi: "3.0.3"
info:
  title: FIDES Platform API
  version: "0.1.0"
  description: Platform metadata, passkey binding, and trust-anchor governance API.
servers:
  - url: http://localhost:3600
paths:
  /health:
    get:
      summary: Read platform-api health and persistence status.
      responses:
        "200":
          description: Healthy service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Degraded service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /metrics:
    get:
      summary: Read Prometheus metrics.
      responses:
        "200":
          description: Prometheus text metrics.
          content:
            text/plain:
              schema:
                type: string
  /v1/version:
    get:
      summary: Read platform-api version metadata.
      responses:
        "200":
          description: Version metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /v1/topology:
    get:
      summary: Read configured FIDES service topology.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Service topology.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTopologyResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /v1/passkeys/bindings:
    post:
      summary: Store or update a verified passkey credential binding.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyCredentialBinding"
      responses:
        "201":
          description: Created binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyBindingResponse"
        "200":
          description: Updated binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyBindingResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /v1/passkeys/principals/{did}/credentials:
    get:
      summary: List passkey credential descriptors for a principal DID.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Principal credential descriptors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCredentialsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /v1/passkeys/credentials/{credentialId}:
    get:
      summary: Read a stored passkey credential binding.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyBindingResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      summary: Delete a stored passkey credential binding.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /v1/trust-anchors:
    get:
      summary: List governed trust anchors.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TrustAnchorStatus"
      responses:
        "200":
          description: Governed trust anchors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustAnchorsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Store or update a governed trust anchor.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustAnchorRecord"
      responses:
        "201":
          description: Created trust anchor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustAnchorResponse"
        "200":
          description: Updated trust anchor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustAnchorResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /v1/trust-anchors/distribution:
    get:
      summary: Read deterministic active trust-anchor distribution bundle.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: issuerDid
          in: query
          required: false
          schema:
            type: string
        - name: requiredScope
          in: query
          required: false
          schema:
            type: string
        - name: trustedIssuerDids
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Trust-anchor distribution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustAnchorDistributionResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /v1/trust-anchors/{did}:
    get:
      summary: Read one governed trust anchor.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Governed trust anchor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustAnchorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      summary: Hard-delete one governed trust anchor.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted trust anchor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /v1/trust-anchors/{did}/status:
    patch:
      summary: Suspend, reactivate, or revoke one governed trust anchor.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustAnchorStatusUpdate"
      responses:
        "200":
          description: Updated trust anchor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustAnchorResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Use the legacy SERVICE_API_KEY for full platform access, or configure
        PLATFORM_API_KEYS with scoped keys. Supported platform-api scopes are
        platform:topology:read, platform:passkeys:read,
        platform:passkeys:write, platform:trust-anchors:read,
        platform:trust-anchors:write, and *.
  responses:
    ErrorResponse:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    MutationResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    HealthResponse:
      type: object
      required: [status, service, uptime, timestamp, checks]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        service:
          type: string
          enum: [platform-api]
        uptime:
          type: integer
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
    VersionResponse:
      type: object
      required: [service, version, protocol]
      properties:
        service:
          type: string
          enum: [platform-api]
        version:
          type: string
        protocol:
          type: string
          enum: [fides-v2]
    PlatformTopologyResponse:
      type: object
      required: [service, components]
      properties:
        service:
          type: string
          enum: [platform-api]
        components:
          type: object
          required: [discovery, trustGraph, policyEngine, registry, relay, agentd]
          properties:
            discovery:
              type: string
            trustGraph:
              type: string
            policyEngine:
              type: string
            registry:
              type: string
            relay:
              type: string
            agentd:
              type: string
    PasskeyTransport:
      type: string
      enum: [ble, hybrid, internal, nfc, usb]
    PasskeyCredentialBinding:
      type: object
      required: [principalDid, credentialId, publicKey, relyingPartyId, signCount, createdAt]
      properties:
        principalDid:
          type: string
        credentialId:
          type: string
        publicKey:
          type: string
        relyingPartyId:
          type: string
        signCount:
          type: integer
          minimum: 0
        transports:
          type: array
          items:
            $ref: "#/components/schemas/PasskeyTransport"
        backedUp:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastVerifiedAt:
          type: string
          format: date-time
    PasskeyCredentialDescriptor:
      type: object
      required: [credentialId, relyingPartyId, signCount, createdAt]
      properties:
        credentialId:
          type: string
        relyingPartyId:
          type: string
        signCount:
          type: integer
        transports:
          type: array
          items:
            $ref: "#/components/schemas/PasskeyTransport"
        backedUp:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastVerifiedAt:
          type: string
          format: date-time
    PasskeyBindingResponse:
      type: object
      required: [binding]
      properties:
        binding:
          $ref: "#/components/schemas/PasskeyCredentialBinding"
    PasskeyCredentialsResponse:
      type: object
      required: [principalDid, credentials, count]
      properties:
        principalDid:
          type: string
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/PasskeyCredentialDescriptor"
        count:
          type: integer
    SignedObject:
      type: object
      required: [payload, proof]
      properties:
        payload:
          type: object
        proof:
          type: object
          required: [type, created, verificationMethod, proofPurpose, canonicalizationAlgorithm, proofValue]
          properties:
            type:
              type: string
              enum: [Ed25519Signature2024]
            created:
              type: string
              format: date-time
            verificationMethod:
              type: string
            proofPurpose:
              type: string
              enum: [assertionMethod, authentication, delegation, capabilityInvocation]
            canonicalizationAlgorithm:
              type: string
              enum: [https://fides.dev/canonical-json/v1]
            proofValue:
              type: string
    TrustAnchorStatus:
      type: string
      enum: [active, suspended, revoked]
    TrustAnchorRecord:
      type: object
      required: [did, name, publicKey, attestation, status, scopes, createdAt]
      properties:
        did:
          type: string
        name:
          type: string
        publicKey:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
        attestation:
          $ref: "#/components/schemas/SignedObject"
        status:
          $ref: "#/components/schemas/TrustAnchorStatus"
        scopes:
          type: array
          minItems: 1
          items:
            type: string
        issuerDid:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        reason:
          type: string
        metadata:
          type: object
    TrustAnchorResponse:
      type: object
      required: [anchor]
      properties:
        anchor:
          $ref: "#/components/schemas/TrustAnchorRecord"
    TrustAnchorsResponse:
      type: object
      required: [anchors, count]
      properties:
        anchors:
          type: array
          items:
            $ref: "#/components/schemas/TrustAnchorRecord"
        count:
          type: integer
    TrustAnchorDistributionEntry:
      type: object
      required: [did, name, publicKey, scopes, createdAt]
      properties:
        did:
          type: string
        name:
          type: string
        publicKey:
          type: string
        scopes:
          type: array
          items:
            type: string
        issuerDid:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    TrustAnchorDistribution:
      type: object
      required: [version, generatedAt, anchors]
      properties:
        version:
          type: string
          enum: [fides.trust-anchors.v1]
        generatedAt:
          type: string
          format: date-time
        issuerDid:
          type: string
        anchors:
          type: array
          items:
            $ref: "#/components/schemas/TrustAnchorDistributionEntry"
    TrustAnchorDistributionResponse:
      type: object
      required: [distribution]
      properties:
        distribution:
          $ref: "#/components/schemas/TrustAnchorDistribution"
    TrustAnchorStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TrustAnchorStatus"
        revokedAt:
          type: string
          format: date-time
        reason:
          type: string
