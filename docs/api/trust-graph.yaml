openapi: "3.0.3"
info:
  title: FIDES Trust Graph Service
  version: "2.0.0"
  description: |
    Trust edge management, reputation scoring, capability-level trust
    computation, and incident tracking for the FIDES v2 trust fabric.

    This OpenAPI document describes the standalone trust-graph service. The
    primary local FIDES v2 developer surface is agentd on
    http://localhost:7345. Trust and reputation are capability-specific signals;
    they do not grant permission. Authority requires policy evaluation and a
    scoped SessionGrant through agentd.
  contact:
    name: FIDES Protocol
    url: https://github.com/EfeDurmaz16/fides

servers:
  - url: http://localhost:3200
    description: Local development
  - url: https://trust-graph.fides.example.com
    description: Production

tags:
  - name: Health
  - name: Trust
  - name: Revocations
  - name: Incidents
  - name: Identities

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Service health check
      responses:
        "200":
          description: All checks pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Degraded (database unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/trust:
    post:
      operationId: createTrustEdge
      tags: [Trust]
      summary: Create a trust edge
      description: |
        Establishes a directed trust relationship from an issuer to a subject.
        Trust level is 0–100. Optional capability ID scopes the trust to a
        specific capability. Requires API key authentication with the
        `X-API-Key` header. In production, the endpoint returns `503` when
        neither `SERVICE_API_KEY` nor `TRUST_GRAPH_API_KEYS` is configured.
        When `TRUST_GRAPH_API_KEYS` is configured, the key must include
        `trust:edges:write` or `*`.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrustRequest"
      responses:
        "201":
          description: Trust edge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/trust/{did}/score:
    get:
      operationId: getReputationScore
      tags: [Trust]
      summary: Get reputation score for a DID
      description: |
        Computes a reputation score based on direct and transitive trust edges.
        Algorithm: direct × 1.0 + depth-2 × 0.5 + depth-3+ × 0.25.
        The DID is resolved through discovery before scores are computed so
        unknown identities fail before reputation cache writes.
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Reputation score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReputationScore"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/trust/{from}/{to}:
    get:
      operationId: getTrustPath
      tags: [Trust]
      summary: Get trust path between two DIDs
      parameters:
        - name: from
          in: path
          required: true
          schema:
            type: string
          example: "did:fides:alice"
        - name: to
          in: path
          required: true
          schema:
            type: string
          example: "did:fides:bob"
      responses:
        "200":
          description: Trust path result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustPath"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/trust/{did}/capability/{capabilityId}:
    get:
      operationId: getCapabilityScore
      tags: [Trust]
      summary: Get capability-specific trust score
      description: |
        Resolves the DID through discovery before computing capability trust.
        Unknown identities return `404`; discovery outages return `503`.
      parameters:
        - $ref: "#/components/parameters/DidParam"
        - name: capabilityId
          in: path
          required: true
          schema:
            type: string
          example: "web:search"
      responses:
        "200":
          description: Capability score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityScore"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/trust/{did}/capability/{capabilityId}/invoke:
    post:
      operationId: recordCapabilityInvocation
      tags: [Trust]
      summary: Record a capability invocation
      description: |
        Increments the invocation counter for capability-scoring purposes.
        Resolves the DID through discovery before writing invocation state.
        Unknown identities return `404`; discovery outages return `503`.
        Requires API key authentication with the `X-API-Key` header. When
        `TRUST_GRAPH_API_KEYS` is configured, the key must include
        `trust:capability:invoke` or `*`.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/DidParam"
        - name: capabilityId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Invocation recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/incidents:
    post:
      operationId: recordIncident
      tags: [Incidents]
      summary: Record a trust incident
      description: |
        Requires API key authentication with the `X-API-Key` header. When
        `TRUST_GRAPH_API_KEYS` is configured, the key must include
        `trust:incidents:write` or `*`.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentRequest"
      responses:
        "201":
          description: Incident recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/incidents/{did}:
    get:
      operationId: getIncidents
      tags: [Incidents]
      summary: Get incidents for a DID
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: List of incidents
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Incident"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/revocations:
    post:
      operationId: recordRevocation
      tags: [Revocations]
      summary: Record an authority revocation
      description: |
        Records a signed authority revocation propagated from agentd and marks
        active trust edges touching the revoked DID as revoked. Requires API key
        authentication with the `X-API-Key` header. When `TRUST_GRAPH_API_KEYS`
        is configured, the key must include `trust:revocations:write` or `*`.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRevocationRequest"
      responses:
        "201":
          description: Revocation recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  revokedEdges:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/revocations/{did}:
    get:
      operationId: getRevocation
      tags: [Revocations]
      summary: Get latest revocation state for a DID
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Latest revocation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevocationState"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/identities/{did}:
    get:
      operationId: getIdentity
      tags: [Identities]
      summary: Get identity by DID
      parameters:
        - $ref: "#/components/parameters/DidParam"
      responses:
        "200":
          description: Identity found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /metrics:
    get:
      operationId: getMetrics
      tags: [Health]
      summary: Prometheus metrics
      responses:
        "200":
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Use `SERVICE_API_KEY` for a shared service key or `TRUST_GRAPH_API_KEYS`
        for least-privilege JSON-scoped keys. Trust-graph write scopes are
        `trust:edges:write`, `trust:capability:invoke`,
        `trust:incidents:write`, `trust:revocations:write`, and `*`.

  parameters:
    DidParam:
      name: did
      in: path
      required: true
      schema:
        type: string
      example: "did:fides:CVDFLCAjXhVWiPXH9nTCTpCgVzmDVoiPzNJYuccr1dqB"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        service:
          type: string
          example: trust-graph
        version:
          type: string
          example: "0.1.0"
        uptime:
          type: integer
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [connected, disconnected]

    CreateTrustRequest:
      type: object
      required: [issuerDid, subjectDid, trustLevel, signature, payload]
      properties:
        issuerDid:
          type: string
          description: DID of the trust-issuing agent
        subjectDid:
          type: string
          description: DID of the agent being trusted
        trustLevel:
          type: integer
          minimum: 0
          maximum: 100
          description: Trust level (0=no trust, 100=absolute trust)
        capabilityId:
          type: string
          description: Optional capability scope for trust
        context:
          type: string
        signature:
          type: string
          description: Hex-encoded Ed25519 signature over canonical JSON payload
        payload:
          type: string
          description: Canonical JSON payload that was signed

    ReputationScore:
      type: object
      properties:
        score:
          type: number
          minimum: 0
          maximum: 1
        directTrusters:
          type: integer
        transitiveTrusters:
          type: integer
        computedAt:
          type: string
          format: date-time

    TrustPath:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        found:
          type: boolean
        path:
          type: array
          items:
            $ref: "#/components/schemas/TrustEdge"

    TrustEdge:
      type: object
      properties:
        sourceDid:
          type: string
        targetDid:
          type: string
        trustLevel:
          type: integer
        capabilityId:
          type: string
          nullable: true
        context:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true

    CapabilityScore:
      type: object
      properties:
        did:
          type: string
        capabilityId:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1
        invocationCount:
          type: integer
        incidentCount:
          type: integer
        lastComputed:
          type: string
          format: date-time

    CreateIncidentRequest:
      type: object
      required: [did, capabilityId, description]
      properties:
        did:
          type: string
        capabilityId:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]

    CreateRevocationRequest:
      type: object
      required: [record]
      properties:
        did:
          type: string
        reason:
          type: string
        revokedBy:
          type: string
        record:
          $ref: "#/components/schemas/AuthorityRevocationRecord"

    RevocationState:
      type: object
      required: [did, revoked]
      properties:
        did:
          type: string
        revoked:
          type: boolean
        record:
          $ref: "#/components/schemas/AuthorityRevocationRecord"

    AuthorityRevocationRecord:
      type: object
      required: [id, did, reason, revokedAt, revokedBy, signature, propagatedTo]
      properties:
        id:
          type: string
        did:
          type: string
        reason:
          type: string
        revokedAt:
          type: string
          format: date-time
        revokedBy:
          type: string
        signature:
          type: string
          description: Hex-encoded Ed25519 signature over the canonical revocation body
        propagatedTo:
          type: array
          items:
            type: string

    Incident:
      type: object
      properties:
        id:
          type: string
          format: uuid
        did:
          type: string
        capabilityId:
          type: string
        description:
          type: string
        severity:
          type: string
        createdAt:
          type: string
          format: date-time

    IdentityResponse:
      type: object
      properties:
        did:
          type: string
        publicKey:
          type: string
          description: Hex-encoded Ed25519 public key
        metadata:
          type: object
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Upstream dependency unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      headers:
        Retry-After:
          schema:
            type: integer
